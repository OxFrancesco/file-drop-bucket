<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'">
<title>BuddyFiles local drag regression</title>
<style>body{font:20px system-ui;background:#f5f5f5;color:#111;margin:30px}#drop{border:4px dashed #246;padding:50px;width:500px;min-height:160px}pre{white-space:pre-wrap;font-size:17px}input{display:block;margin:20px 0} .pass{background:#bfeac9}</style>
<h1>Local native file drop test</h1>
<p>No network. Drop the harmless Hello bucket.txt fixture below.</p>
<div id="drop">Drop here. Waiting for a native drop.</div>
<label>Or test the browser's real file input: <input id="input" type="file" multiple></label>
<pre id="result">NOT TESTED</pre>
<script>
const expected = {'Hello bucket.txt':'Harmless bucket drag fixture.\n', 'second.txt':'Second fixture.\n'};
window.dropReport = null;
async function receive(files, source, trusted) {
 const received = await Promise.all(Array.from(files, async f => ({
   name: f.name,
   size: f.size,
   bytes: Array.from(new Uint8Array(await f.arrayBuffer()))
 })));
 const pass = trusted && received.length > 0 && received.every(f => {
   const bytes = Array.from(new TextEncoder().encode(expected[f.name] ?? ''));
   return Object.hasOwn(expected,f.name) && f.size === bytes.length && JSON.stringify(f.bytes) === JSON.stringify(bytes);
 });
 window.dropReport = {pass,source,trusted,received};
 document.querySelector('#result').textContent = JSON.stringify(window.dropReport,null,2);
 document.querySelector('#drop').textContent = `${pass ? 'PASS' : 'FAIL'}: ${received.length} file(s) through ${source}. Exact fixture filenames and bytes ${pass ? 'verified' : 'NOT verified'}.`;
 document.querySelector('#drop').className = pass ? 'pass' : '';
}
const drop=document.querySelector('#drop');
drop.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'});
drop.addEventListener('drop',e=>{e.preventDefault();receive(e.dataTransfer.files,'DataTransfer drop',e.isTrusted)});
document.querySelector('#input').addEventListener('change',e=>receive(e.target.files,'file input',e.isTrusted));
</script>
